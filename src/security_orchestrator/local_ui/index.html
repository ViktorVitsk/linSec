<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Security Orchestrator — локальный монитор</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body><header><div><strong>Security Orchestrator</strong><span>Локальное наблюдение</span></div><button id="logout" hidden>Забыть ключ</button></header>
<main><section id="login"><p class="eyebrow">Доступ к evidence</p><h1>Открыть локальный монитор</h1><p>Введите ключ, указанный при запуске <code>sec ui</code>. Ключ действует до остановки UI, максимум 8 часов.</p><label for="token">Ключ доступа</label><input id="token" type="password" autocomplete="off" spellcheck="false" maxlength="128"><button id="connect">Открыть</button><p>Данные остаются на компьютере. Интерфейс только для чтения.</p></section>
<p id="error" role="alert" hidden></p><div id="workspace" hidden><nav><button id="overview-button">Обзор</button><button id="alerts-button">Предупреждения</button><button id="refresh">Обновить</button></nav><p id="updated" class="muted"></p><section id="overview"></section><section id="alerts" hidden></section><section id="detail" hidden></section></div></main>
</body></html>
