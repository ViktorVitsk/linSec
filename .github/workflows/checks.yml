name: Repository checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv
      UV_PYTHON_INSTALL_DIR: ${{ github.workspace }}/.cache/python
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.12"
          enable-cache: false
          download-from-astral-mirror: false
      - name: Install locked project environment
        run: uv sync --locked --group dev
      - name: Repository hygiene
        run: uv run --no-sync python scripts/check_m0.py
      - name: Behavioral tests
        run: uv run --no-sync python -m unittest discover -s tests -v
      - name: Python static analysis
        run: uv run --no-sync ruff check --no-cache .
      - name: No generated tracked changes
        run: git diff --exit-code
